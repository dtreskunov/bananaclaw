<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Preview</title>
    <style>
      html,
      body,
      #preview-viewport {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }

      #preview-content {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        transform-origin: 0 0;
      }
    </style>
  </head>
  <body>
    <div id="preview-viewport">
      <iframe id="preview-content" src="{{PREVIEW_SRC}}" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
    <script>
      (() => {
        const frame = document.getElementById('preview-content');
        const attached = new WeakSet();
        let scale = 1;
        let pinch = null;

        const clamp = (value) => Math.min(4, Math.max(0.25, value));
        const distance = (touches) => Math.hypot(
          touches[0].clientX - touches[1].clientX,
          touches[0].clientY - touches[1].clientY,
        );
        const apply = (value) => {
          scale = clamp(value);
          frame.style.width = 100 / scale + '%';
          frame.style.height = 100 / scale + '%';
          frame.style.transform = 'scale(' + scale + ')';
        };

        const attach = () => {
          let doc;
          try {
            doc = frame.contentDocument;
          } catch {
            return;
          }
          if (!doc || attached.has(doc)) return;
          attached.add(doc);

          doc.addEventListener('touchstart', (event) => {
            if (event.touches.length !== 2) return;
            pinch = { distance: distance(event.touches), scale };
            event.preventDefault();
          }, { passive: false });
          doc.addEventListener('touchmove', (event) => {
            if (event.touches.length !== 2 || !pinch) return;
            event.preventDefault();
            apply(pinch.scale * distance(event.touches) / pinch.distance);
          }, { passive: false });
          doc.addEventListener('touchend', (event) => {
            if (event.touches.length < 2) pinch = null;
          }, { passive: true });
          doc.addEventListener('touchcancel', () => {
            pinch = null;
          }, { passive: true });
          doc.addEventListener('wheel', (event) => {
            if (!event.ctrlKey && !event.metaKey) return;
            event.preventDefault();
            apply(scale * Math.exp(-event.deltaY * 0.002));
          }, { passive: false });

          let gestureScale = scale;
          doc.addEventListener('gesturestart', (event) => {
            gestureScale = scale;
            event.preventDefault();
          }, { passive: false });
          doc.addEventListener('gesturechange', (event) => {
            event.preventDefault();
            apply(gestureScale * event.scale);
          }, { passive: false });
          doc.addEventListener('gestureend', (event) => {
            event.preventDefault();
          }, { passive: false });
        };

        frame.addEventListener('load', attach);
        addEventListener('load', attach, { once: true });
        attach();
        addEventListener('message', (event) => {
          if (
            event.source === frame.contentWindow
            && event.origin === location.origin
            && event.data?.type === 'nanoclaw-private-web-expired'
          ) {
            parent.postMessage(event.data, "{{PARENT_ORIGIN}}");
          }
        });
      })();
    </script>
  </body>
</html>
